# sarfeh-api-ir.pendarsolutions.ir over HTTPS: the mirror in Iran (see sarfeh-api-ir.conf). iran-cert.sh puts this at
# /opt/arvan-edge/conf.d/sarfeh-api-ir-https.conf once the certificate exists, and certbot renews it with the same hook.
limit_req_zone $binary_remote_addr zone=sarfeh_hub:10m rate=5r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name sarfeh-api-ir.pendarsolutions.ir;
    ssl_certificate     /etc/nginx/ssl/sarfeh-api-ir.crt;
    ssl_certificate_key /etc/nginx/ssl/sarfeh-api-ir.key;

    client_max_body_size 20m;
    gzip on;
    gzip_types application/json;

    location / {
        limit_req zone=sarfeh_hub burst=20 nodelay;
        proxy_pass http://127.0.0.1:18095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # the service limits new tokens per address: this one, which a client can't set
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 75s;
    }
}
