# sarfeh-api-ir.pendarsolutions.ir - Sarfeh's price service, the mirror in Iran (deploy/hub in pendarsolutions/Sarfeh).
# Lives at /opt/arvan-edge/conf.d/sarfeh-api-ir.conf on 109.122.247.136. A DNS-only record, not through a CDN, so
# servers in Iran reach it inside the country.
#
# Port 80 only answers Let's Encrypt (certbot standalone on 127.0.0.1:8899, run by iran-cert.sh) and sends everything
# else to HTTPS, which sarfeh-api-ir-https.conf (iran-https.conf) serves once the certificate exists.
server {
    listen 80;
    server_name sarfeh-api-ir.pendarsolutions.ir;

    location /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:8899;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
