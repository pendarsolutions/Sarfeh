# sarfeh-api.pendarsolutions.ir - Sarfeh's price service, the mirror outside Iran: container sarfeh-hub (~/sarfeh-hub,
# deploy/hub in pendarsolutions/Sarfeh). Cloudflare-proxied (Flexible) -> :80 here. Only Cloudflare and Pendar's price
# reader may connect, so CF-Connecting-IP is the client's address, which the service's per-address limits use.
# Lives at /opt/infrastructure/nginx/services/sarfeh-api.conf.services on that server.
limit_req_zone $http_cf_connecting_ip zone=sarfeh_hub:10m rate=5r/s;

server {
    listen 80;
    server_name sarfeh-api.pendarsolutions.ir;
    # Pendar's price reader, which sends each new catalog here
    allow 159.195.110.103;
    allow 173.245.48.0/20;
    allow 103.21.244.0/22;
    allow 103.22.200.0/22;
    allow 103.31.4.0/22;
    allow 141.101.64.0/18;
    allow 108.162.192.0/18;
    allow 190.93.240.0/20;
    allow 188.114.96.0/20;
    allow 197.234.240.0/22;
    allow 198.41.128.0/17;
    allow 162.158.0.0/15;
    allow 104.16.0.0/13;
    allow 104.24.0.0/14;
    allow 172.64.0.0/13;
    allow 131.0.72.0/22;
    allow 2400:cb00::/32;
    allow 2606:4700::/32;
    allow 2803:f800::/32;
    allow 2405:b500::/32;
    allow 2405:8100::/32;
    allow 2a06:98c0::/29;
    allow 2c0f:f248::/32;
    deny all;

    client_max_body_size 20m;

    location / {
        limit_req zone=sarfeh_hub burst=20 nodelay;
        # resolved per request, so this nginx still starts while the container is down
        set $sarfeh_hub sarfeh-hub:8090;
        proxy_pass http://$sarfeh_hub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 75s;
    }
}
