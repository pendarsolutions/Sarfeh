# Sarfeh's central service, on each of Pendar's two mirrors: the price service every installation updates from (and
# the shared Bale bot's relay, if it's given a bot token). Not part of an installation. See deploy/hub/README.md.
#
#   cd ~/sarfeh-hub && docker compose up -d      (deploy/hub/deploy.sh does this)
#
# .env next to this file: FINOPS_HUB_PUBLIC_KEY, FINOPS_HUB_TOKEN_SECRET (the same on both mirrors), and how the
# server's own nginx reaches the service:
#   in Iran, arvan-edge on the host network:    COMPOSE_FILE=compose.yml:compose.local.yml   (127.0.0.1:18095)
#   outside, mn2-nginx on infrastructure_default: COMPOSE_FILE=compose.yml:compose.edge.yml  (sarfeh-hub:8090)
#
# It runs from the app image (on GitHub's registry, which a server in Iran can reach when Docker Hub can't), with the
# service's code from ./src mounted over the image's copy, so deploy.sh and a restart update it.
name: sarfeh-hub

services:
  hub:
    image: ghcr.io/pendarsolutions/finops-agent-app:${FINOPS_VERSION:-0.5.0}
    container_name: sarfeh-hub
    command: ["uvicorn", "finops_relay.main:app", "--host", "0.0.0.0", "--port", "8090", "--no-access-log"]
    restart: unless-stopped
    env_file: .env
    environment:
      FINOPS_HUB_DATA: /app/var/prices
      FINOPS_RELAY_DB: /app/var/relay.db
      PYTHONPATH: /app/apps/relay
    volumes:
      - ./src/apps/relay:/app/apps/relay:ro
      - hub-data:/app/var
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m

volumes:
  hub-data:
