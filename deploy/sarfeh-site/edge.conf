# Goes inside the pendarsolutions.ir server block of /opt/infrastructure/nginx/services/web-pendarsolutions.conf.services,
# before `location /`. The path is passed through unchanged: the container serves the site under /sarfeh/ as well.
    # Sarfeh («صرفه») at /sarfeh/: Iranian cloud prices side by side, container sarfeh-site (~/sarfeh, deployed from
    # pendarsolutions/Sarfeh with deploy/sarfeh-site/deploy.sh). Static files and prices.json, refreshed twice a day.
    location = /sarfeh { return 301 https://$host/sarfeh/$is_args$args; }
    location /sarfeh/ {
        limit_req zone=general_limit burst=50 nodelay;
        set $sarfeh_upstream sarfeh-site:80;
        proxy_pass http://$sarfeh_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $layla_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
