# Inside the sarfeh-site container: static files only, under /sarfeh/. Cloudflare and the edge nginx sit in front.

# Visits are counted from this server's own log (stats.py; see README.md): no cookie, and no script on the pages.
# An address is written without its last part, and stats.py empties the log every ten minutes. A request that
# didn't come through the edge, which is the container's health check, isn't logged at all.
map $http_x_forwarded_for $sarfeh_visitor {
    default "";
    "~^(?<net>\d+\.\d+\.\d+)\.\d+" "$net.0";
    "~^(?<net>[0-9a-fA-F]+:[0-9a-fA-F]*:[0-9a-fA-F]*)" "$net::";
}
map $http_x_forwarded_for $sarfeh_counted {
    default 1;
    "" 0;
}
log_format visits escape=json '{"t":"$time_iso8601","ip":"$sarfeh_visitor","cc":"$http_cf_ipcountry",'
                              '"m":"$request_method","u":"$request_uri","s":$status,"r":"$http_referer",'
                              '"a":"$http_user_agent"}';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript application/json;
    server_tokens off;
    absolute_redirect off;
    access_log /var/log/sarfeh/access.log visits if=$sarfeh_counted;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Server-wide, so every location keeps them: a location that adds its own header loses these.
    # The site loads nothing from other servers and has no inline script.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /sarfeh { return 301 /sarfeh/$is_args$args; }
    location = /sarfeh/prices { return 301 /sarfeh/prices/$is_args$args; }

    # Built files carry a hash in their names: keep them a year.
    location /sarfeh/assets/ {
        expires 1y;
    }
    # The open price table and the record of its changes, rewritten twice a day: always checked again, and
    # readable from any site.
    location ~ ^/sarfeh/(prices|changes)\.json$ {
        expires -1;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # The owner's visit counts, written by stats.py: behind a password, never stored by a cache or listed by a
    # search engine. The headers are repeated because a location with its own header loses the server's.
    location = /sarfeh/stats { return 301 /sarfeh/stats/; }
    location /sarfeh/stats/ {
        alias /usr/share/nginx/stats/;
        auth_basic "Sarfeh visits";
        auth_basic_user_file /etc/nginx/sarfeh-stats/htpasswd;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location /sarfeh/ {
        expires -1;
        try_files $uri $uri/ =404;
    }
    location / {
        return 404;
    }
}
